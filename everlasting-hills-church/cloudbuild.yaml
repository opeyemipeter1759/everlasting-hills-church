steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/everlasting-hills-church-git'
      - '--build-arg'
      - 'NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_URL=${_NEXT_PUBLIC_SUPABASE_URL}'
      - '--build-arg'
      - 'NEXT_PUBLIC_SUPABASE_ANON_KEY=${_NEXT_PUBLIC_SUPABASE_ANON_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_YOUTUBE_API_KEY=${_NEXT_PUBLIC_YOUTUBE_API_KEY}'
      - '--build-arg'
      - 'NEXT_PUBLIC_YOUTUBE_CHANNEL_ID=${_NEXT_PUBLIC_YOUTUBE_CHANNEL_ID}'
      - '.'
    dir: 'everlasting-hills-church'

  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/everlasting-hills-church-git']

  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'everlasting-hills-church-git'
      - '--image=europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/everlasting-hills-church-git'
      - '--region=europe-west1'
      - '--port=3000'
      - '--allow-unauthenticated'
      - '--set-env-vars=NEXT_PUBLIC_API_BASE_URL=${_NEXT_PUBLIC_API_BASE_URL},DEFAULT_TENANT_ID=${_DEFAULT_TENANT_ID},NEXT_PUBLIC_YOUTUBE_API_KEY=${_NEXT_PUBLIC_YOUTUBE_API_KEY},NEXT_PUBLIC_YOUTUBE_CHANNEL_ID=${_NEXT_PUBLIC_YOUTUBE_CHANNEL_ID}'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/everlasting-hills-church-git'

# The Developer Connect trigger runs this build as a user-specified service
# account. Cloud Build refuses to start such a build unless it is told where the
# logs go, because a user-owned service account has no default logs bucket:
#   "if 'build.service_account' is specified, the build must either specify
#    'build.logs_bucket' ... or use CLOUD_LOGGING_ONLY / NONE"
# Cloud Logging is the right destination here — no bucket to create or pay for,
# and the logs stay in the same place as the Cloud Run service's.
options:
  logging: CLOUD_LOGGING_ONLY