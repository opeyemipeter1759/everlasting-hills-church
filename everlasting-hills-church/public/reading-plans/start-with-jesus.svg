<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" role="img">
<defs><linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#4A0817"/>
    <stop offset="0.62" stop-color="#87102C"/>
    <stop offset="1" stop-color="#6E0C24"/>
  </linearGradient>
  <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
    <stop offset="0" stop-color="#FFF8F0"/>
    <stop offset="0.55" stop-color="#E8B44A" stop-opacity="0.95"/>
    <stop offset="1" stop-color="#E8B44A" stop-opacity="0"/>
  </radialGradient>
  <!-- User space, centred on the sun, so every ray fades outward the same way.
       An objectBoundingBox gradient would be degenerate on the horizontal and
       vertical rays, whose bounding box has no area, and those rays would not
       render at all. -->
  <radialGradient id="ray" gradientUnits="userSpaceOnUse" cx="400" cy="288" r="240">
    <stop offset="0.2" stop-color="#E8B44A" stop-opacity="0.85"/>
    <stop offset="1" stop-color="#E8B44A" stop-opacity="0"/>
  </radialGradient></defs>
<rect width="800" height="400" fill="url(#sky)"/>
  <g><circle cx="400" cy="288" r="282" fill="none" stroke="#FFF4F6" stroke-opacity="0.055" stroke-width="1.00"/>
