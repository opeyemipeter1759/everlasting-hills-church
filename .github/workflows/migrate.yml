name: Production database migration

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Type BASELINE_RECORDED_AND_BACKUP_VERIFIED to continue
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: production-database-migration
  cancel-in-progress: false

jobs:
  migrate:
    name: Prisma migrate deploy
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: ehc-backend
    env:
      NODE_ENV: production
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
    steps:
      - name: Require explicit operator confirmation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "BASELINE_RECORDED_AND_BACKUP_VERIFIED"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: ehc-backend/package-lock.json
      - run: npm ci
      - name: Validate checked-in Prisma schema
        run: npx prisma validate
      - name: Verify production baseline (read-only)
        run: npm run migration:check-baseline
      - name: Apply pending reviewed migrations
        run: npx prisma migrate deploy
